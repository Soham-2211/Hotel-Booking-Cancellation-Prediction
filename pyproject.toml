[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-ml"
version = "1.0.0"
description = "Hotel booking cancellation prediction from messy raw PMS data, with leakage-aware evaluation and a cost-based decision threshold."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.6", "matplotlib>=3.8", "pyyaml>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
hotel-ml = "hotel_ml.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
